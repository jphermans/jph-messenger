# JPH Legacy Gateway - minimal PoC compose
# Usage:
#   docker compose up -d --build
#   curl http://localhost:8080/health
services:
  jph-gateway:
    build: .
    container_name: jph-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Agent Zero API (optional - agent routing falls back gracefully if unset)
      A0_API_URL: ${A0_API_URL:-http://host.docker.internal:5000}
      A0_API_KEY: ${A0_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
